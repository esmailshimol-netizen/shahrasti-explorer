<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শাহরাস্তি ১৫৫ গ্রাম ভ্রমণ ম্যাপ - Shahrasti Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls (Hidden on download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Dynamic Interactive Map Box that shows Selected Village Names */
    .map-box {
      width: 100%;
      background: #11221b;
      border-radius: 18px;
      padding: 15px;
      border: 2px solid #006a4e;
      position: relative;
      margin-bottom: 12px;
    }

    .map-visual {
      width: 100%;
      min-height: 190px;
      max-height: 230px;
      background: linear-gradient(135deg, #1b382d, #0d1f18);
      border-radius: 12px;
      padding: 12px;
      border: 1px dashed #428a6f;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .map-header-info {
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .map-title-main {
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
    }

    .map-sub-desc {
      color: #a3d9c9;
      font-size: 11.5px;
    }

    /* Selected Villages Tags Container inside Map */
    .selected-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      justify-content: center;
    }

    .village-tag {
      background: #006a4e;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 11.5px;
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      border: 1px solid #428a6f;
      animation: fadeIn 0.3s ease;
    }

    .no-village-selected {
      color: #7fa89b;
      font-size: 12.5px;
      text-align: center;
      margin: auto;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Search & Checklist Section */
    .search-box {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #dcd5c0;
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      margin-bottom: 8px;
      background: #fff;
    }

    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 4px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 6px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
    }
    .spot-item input { margin-right: 10px; transform: scale(1.1); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13px; width: 100%; color: #333; font-weight: 500; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 12px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

          <div class="map-sub-desc" id="mapStatusText">এখনও কোনো গ্রাম সিলেক্ট করা হয়নি</div>

      <div class="spot-item"><input type="checkbox" class="spot" value="ইছাপুরা" onchange="updateResult()"><label>ইছাপুরা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="বোস্তা" onchange="updateResult()"><label>বোস্তা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="শিমলা" onchange="updateResult()"><label>শিমলা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="তারালিয়া" onchange="updateResult()"><label>তারালিয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="বলশীদ" onchange="updateResult()"><label>বলশীদ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="টামটা বাজার" onchange="updateResult()"><label>টামটা বাজার</label></div>

      <div class="spot-item"><input type="checkbox" class="spot" value="সূচীপাড়া" onchange="updateResult()"><label>সূচীপাড়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="চেঙ্গাচাল" onchange="updateResult()"><label>চেঙ্গাচাল</label></div>

      <div class="spot-item"><input type="checkbox" class="spot" value="পাঁচরুখী" onchange="updateResult()"><label>পাঁচরুখী</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="ডুশুয়া" onchange="updateResult()"><label>ডুশুয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="রাড়া" onchange="updateResult()"><label>রাড়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" value="সেতরা" onchange="updateResult()"><label>সেতরা</label></div>

    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    const totalVillages = 155;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checkedCheckboxes = document.querySelectorAll('.spot:checked');
      const checkedCount = checkedCheckboxes.length;
      const percentage = Math.round((checkedCount / totalVillages) * 100);

      document.getElementById('scoreNum').innerText = `${checkedCount}/${totalVillages}`;
      document.getElementById('percentText').innerText = `${percentage}% গ্রাম ঘোরা হয়েছে`;
      document.getElementById('mapStatusText').innerText = `${checkedCount}টি গ্রাম ভ্রমণ করা হয়েছে`;

      // Update Map Tags dynamically
      const tagsContainer = document.getElementById('mapTagsContainer');
      tagsContainer.innerHTML = '';

      if (checkedCount === 0) {
        tagsContainer.innerHTML = '<div class="no-village-selected">নিচের তালিকা থেকে গ্রাম সিলেক্ট করলে এখানে নামগুলো ভেসে উঠবে</div>';
      } else {
        checkedCheckboxes.forEach(cb => {
          const villageName = cb.value;
          const tag = document.createElement('div');
          tag.className = 'village-tag';
          tag.innerText = villageName;
          tagsContainer.appendChild(tag);
        });
      }
    }

    function filterVillages() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.spot-item');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(input)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'shahrasti-villages-travel-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
