<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শাহরাস্তি ভ্রমণ ম্যাপ - Shahrasti Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f4f6; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #fbf9f4;
      max-width: 450px;
      width: 100%;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e3dec9;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 2px solid #eae5d2;
      padding-bottom: 15px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid #006a4e;
      background: #ddd;
    }

    .user-titles .subtitle {
      font-size: 12px;
      color: #777;
      margin: 0;
      font-weight: 600;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Counter Badge (Right side like reference) */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0, 106, 78, 0.2);
    }
    .score-badge span {
      font-size: 13px;
      display: block;
      opacity: 0.9;
    }

    /* Input Controls (Hidden during download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      background: #f0ece1;
      padding: 10px;
      border-radius: 10px;
    }
    .input-controls input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    /* Map Display Area */
    .map-box {
      width: 100%;
      background: #f5f2e8;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #dcd4be;
      text-align: center;
      position: relative;
    }

    .map-box svg {
      width: 100%;
      height: auto;
      max-height: 270px;
    }

    /* Union Map Shapes Styling */
    .union-shape {
      fill: #e8e2cf;
      stroke: #ffffff;
      stroke-width: 1.5;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .union-shape:hover {
      fill: #c5bc9e;
    }
    .union-shape.active {
      fill: #006a4e !important;
      stroke: #ffffff;
    }

    .map-text {
      font-size: 9.5px;
      fill: #444;
      font-weight: 600;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .map-text.active-text {
      fill: #ffffff;
    }

    /* Checklist Section */
    .checklist-title {
      font-size: 14px;
      font-weight: bold;
      color: #006a4e;
      margin: 15px 0 8px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae5d2;
      padding-top: 8px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e8dfcc;
    }
    .spot-item input { margin-right: 10px; transform: scale(1.1); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13px; width: 100%; color: #333; }

    /* Footer Progress Bar & Download */
    .footer-progress {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #eae5d2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }
    .watermark {
      font-size: 11px;
      color: #888;
      font-weight: 600;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

  <div class="card-container" id="captureCard">
    
    <!-- Top Header mimicking travel cards -->
    <div class="top-header">
      <div class="profile-box">
        <img id="avatar" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="প্রোফাইল ছবি">
        <div class="user-titles">
          <p class="subtitle">শাহরাস্তি ভ্রমণ ম্যাপ</p>
          <h3 id="userNameDisplay">ইসমাইল হোসেন</h3>
        </div>
      </div>
      
      <div class="score-badge">
        <div id="scoreNum">০/১১</div>
      </div>
    </div>

    <!-- Inputs to customize name & avatar (Hidden when downloading) -->
    <div class="input-controls no-capture">
      <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()" value="ইসমাইল হোসেন">
      <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">
    </div>

    <!-- Interactive Styled Map Box -->
    <div class="map-box">
      <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
        <path id="map-u1" class="union-shape" d="M130,20 L220,20 L210,70 L120,65 Z" onclick="toggleUnion('u1')"/>
        <text id="txt-u1" x="170" y="45" class="map-text">মেহের উত্তর</text>

        <path id="map-u2" class="union-shape" d="M120,65 L210,70 L200,120 L110,110 Z" onclick="toggleUnion('u2')"/>
        <text id="txt-u2" x="160" y="92" class="map-text">মেহের দক্ষিণ</text>

        <path id="map-u3" class="union-shape" d="M220,20 L320,25 L310,80 L210,70 Z" onclick="toggleUnion('u3')"/>
        <text id="txt-u3" x="260" y="48" class="map-text">রায়শ্রী উত্তর</text>

        <path id="map-u4" class="union-shape" d="M210,70 L310,80 L300,135 L200,120 Z" onclick="toggleUnion('u4')"/>
        <text id="txt-u4" x="255" y="102" class="map-text">রায়শ্রী দক্ষিণ</text>

        <path id="map-u5" class="union-shape" d="M110,110 L200,120 L190,175 L100,165 Z" onclick="toggleUnion('u5')"/>
        <text id="txt-u5" x="150" y="142" class="map-text">পৌরসভা</text>

        <path id="map-u6" class="union-shape" d="M20,100 L110,110 L100,165 L10,150 Z" onclick="toggleUnion('u6')"/>
        <text id="txt-u6" x="60" y="132" class="map-text">টামটা উত্তর</text>

        <path id="map-u7" class="union-shape" d="M10,150 L100,165 L90,220 L5,200 Z" onclick="toggleUnion('u7')"/>
        <text id="txt-u7" x="50" y="185" class="map-text">টামটা দক্ষিণ</text>

        <path id="map-u8" class="union-shape" d="M100,165 L190,175 L180,230 L90,220 Z" onclick="toggleUnion('u8')"/>
        <text id="txt-u8" x="140" y="198" class="map-text">সূচীপাড়া উঃ</text>

        <path id="map-u9" class="union-shape" d="M90,220 L180,230 L170,285 L80,275 Z" onclick="toggleUnion('u9')"/>
        <text id="txt-u9" x="130" y="252" class="map-text">সূচীপাড়া দঃ</text>

        <path id="map-u10" class="union-shape" d="M190,175 L300,135 L280,220 L180,230 Z" onclick="toggleUnion('u10')"/>
        <text id="txt-u10" x="235" y="185" class="map-text">চিতোষী পূর্ব</text>

        <path id="map-u11" class="union-shape" d="M180,230 L280,220 L260,300 L170,285 Z" onclick="toggleUnion('u11')"/>
        <text id="txt-u11" x="220" y="258" class="map-text">চিতোষী পশ্চিম</text>
      </svg>
    </div>

    <div class="checklist-title no-capture">ইউনিয়ন নির্বাচন করুন:</div>

    <!-- Union Checklists -->
    <div class="spot-list no-capture">
      <div class="spot-item"><input type="checkbox" class="spot" id="u1" onchange="toggleUnion('u1', true)"><label for="u1">১. মেহের উত্তর ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u2" onchange="toggleUnion('u2', true)"><label for="u2">২. মেহের দক্ষিণ ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u3" onchange="toggleUnion('u3', true)"><label for="u3">৩. রায়শ্রী উত্তর ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u4" onchange="toggleUnion('u4', true)"><label for="u4">৪. রায়শ্রী দক্ষিণ ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u5" onchange="toggleUnion('u5', true)"><label for="u5">৫. শাহরাস্তি পৌরসভা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u6" onchange="toggleUnion('u6', true)"><label for="u6">৬. টামটা উত্তর ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u7" onchange="toggleUnion('u7', true)"><label for="u7">৭. টামটা দক্ষিণ ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u8" onchange="toggleUnion('u8', true)"><label for="u8">৮. সূচীপাড়া উত্তর ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u9" onchange="toggleUnion('u9', true)"><label for="u9">৯. সূচীপাড়া দক্ষিণ ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u10" onchange="toggleUnion('u10', true)"><label for="u10">১০. চিতোষী পূর্ব ইউনিয়ন</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="u11" onchange="toggleUnion('u11', true)"><label for="u11">১১. চিতোষী পশ্চিম ইউনিয়ন</label></div>
    </div>

    <!-- Footer Status -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% শাহরাস্তি ঘোরা হয়েছে</div>
      <div class="watermark">🗺️ Shahrasti Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checkboxes = document.querySelectorAll('.spot');
      const total = checkboxes.length;
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / total) * 100);

      document.getElementById('scoreNum').innerText = `${checked}/${total}`;
      document.getElementById('percentText').innerText = `${percentage}% শাহরাস্তি ঘোরা হয়েছে`;
    }

    function toggleUnion(id, fromCheckbox = false) {
      const checkbox = document.getElementById(id);
      const mapPath = document.getElementById('map-' + id);
      const mapText = document.getElementById('txt-' + id);

      if (!fromCheckbox) {
        checkbox.checked = !checkbox.checked;
      }

      if (checkbox.checked) {
        if(mapPath) mapPath.classList.add('active');
        if(mapText) mapText.classList.add('active-text');
      } else {
        if(mapPath) mapPath.classList.remove('active');
        if(mapText) mapText.classList.remove('active-text');
      }

      updateResult();
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      // Hide inputs and list during capture so only the clean card image is downloaded
      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'shahrasti-travel-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        // Restore elements after download
        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
