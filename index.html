<!DOCTYPE html>

<head>

  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 450px;
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }
    .score-badge span {
      font-size: 10px;
      display: block;
      opacity: 0.9;
      font-weight: normal;
    }

    /* Input Controls (Hidden on download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Map Background Graphic Box */
    .map-box {
      width: 100%;
      background: #f2eee2;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #d4ccb4;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .map-graphic {
      font-size: 16px;
      font-weight: bold;
      color: #006a4e;
      margin-bottom: 5px;
    }
    .map-subtext {
      font-size: 12.5px;
      color: #555;
    }

    /* Search & Checklist Section */
    .search-box {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #dcd5c0;
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      margin-bottom: 8px;
      background: #fff;
    }

    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 4px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 6px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
    }
    .spot-item input { margin-right: 10px; transform: scale(1.1); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13px; width: 100%; color: #333; font-weight: 500; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 11px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>

  <script>
    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checkboxes = document.querySelectorAll('.spot');
      const total = checkboxes.length;
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / total) * 100);

      document.getElementById('scoreNum').innerHTML = `${checked}/${total}`;
      document.getElementById('percentText').innerText = `${percentage}% গ্রাম ঘোরা হয়েছে`;
      document.getElementById('mapStatusText').innerText = `মোট ${total}টি গ্রামের মধ্যে ${checked}টি গ্রাম ভ্রমণ করা হয়েছে`;
    }

    function filterVillages() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.spot-item');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(input)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'shahrasti-village-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>
