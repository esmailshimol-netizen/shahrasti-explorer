<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>চাঁদপুর জেলা ভ্রমণ ম্যাপ - Chandpur Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 450px;
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Layout */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls (Hidden on download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Interactive Chandpur Map Area */
    .map-box {
      width: 100%;
      background: #eee8d5;
      border-radius: 18px;
      padding: 15px;
      border: 1px solid #dcd5c0;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .map-box svg {
      width: 100%;
      height: auto;
      max-height: 260px;
    }

    .upazila-shape {
      fill: #ded6c0;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upazila-shape:hover {
      fill: #c5bc9f;
    }

    .upazila-shape.active {
      fill: #006a4e !important;
    }

    .map-label {
      font-size: 11px;
      fill: #333;
      font-weight: bold;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .upazila-shape.active + .map-label {
      fill: #ffffff;
    }

    /* Checklist Section */
    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 6px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 8px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
      transition: background 0.2s;
    }
    .spot-item:hover { background: #f0f7f4; }
    .spot-item input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13.5px; width: 100%; color: #333; font-weight: 600; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 12px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

  <div class="card-container" id="captureCard">
    
    <!-- Top Header Layout -->
    <div class="top-header">
      <div class="profile-box">
        <img id="avatar" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23999'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="প্রোফাইল ছবি">
        <div class="user-titles">
          <p class="subtitle">চাঁদপুর জেলা ভ্রমণ ম্যাপ</p>
          <h3 id="userNameDisplay">ইসমাইল হোসেন</h3>
        </div>
      </div>
      
      <div class="score-badge" id="scoreNum">
        ০/৮
      </div>
    </div>

    <!-- Controls to Edit Name & Image -->
    <div class="input-controls no-capture">
      <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()" value="ইসমাইল হোসেন">
      <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">
    </div>

    <!-- Chandpur District Map Vector Shapes -->
    <div class="map-box">
      <svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
        <!-- ১. মতলব উত্তর -->
        <path id="u-matlab-n" class="upazila-shape" d="M110,15 L210,15 L200,60 L100,55 Z" onclick="toggleUpazila('u-matlab-n')" />
        <text class="map-label" x="155" y="36">মতলব উত্তর</text>

        <!-- ২. মতলব দক্ষিণ -->
        <path id="u-matlab-s" class="upazila-shape" d="M100,55 L200,60 L185,110 L90,100 Z" onclick="toggleUpazila('u-matlab-s')" />
        <text class="map-label" x="145" y="82">মতলব দক্ষিণ</text>

        <!-- ৩. কচুয়া -->
        <path id="u-kachua" class="upazila-shape" d="M210,15 L320,25 L305,85 L200,60 Z" onclick="toggleUpazila('u-kachua')" />
        <text class="map-label" x="260" y="48">কচুয়া</text>

        <!-- ৪. হাজীগঞ্জ -->
        <path id="u-hajiganj" class="upazila-shape" d="M200,60 L305,85 L285,145 L185,110 Z" onclick="toggleUpazila('u-hajiganj')" />
        <text class="map-label" x="245" y="102">হাজীগঞ্জ</text>

        <!-- ৫. শাহরাস্তি -->
        <path id="u-shahrasti" class="upazila-shape" d="M285,145 L380,120 L355,195 L265,190 Z" onclick="toggleUpazila('u-shahrasti')" />
        <text class="map-label" x="320" y="160">শাহরাস্তি</text>

        <!-- ৬. চাঁদপুর সদর -->
        <path id="u-sadar" class="upazila-shape" d="M90,100 L185,110 L165,185 L75,170 Z" onclick="toggleUpazila('u-sadar')" />
        <text class="map-label" x="130" y="142">চাঁদপুর সদর</text>

        <!-- ৭. ফরিদগঞ্জ -->
        <path id="u-faridganj" class="upazila-shape" d="M165,185 L265,190 L245,260 L145,250 Z" onclick="toggleUpazila('u-faridganj')" />
        <text class="map-label" x="205" y="222">ফরিদগঞ্জ</text>

        <!-- ৮. হাইমচর -->
        <path id="u-haimchar" class="upazila-shape" d="M75,170 L165,185 L145,250 L60,230 Z" onclick="toggleUpazila('u-haimchar')" />
        <text class="map-label" x="112" y="210">হাইমচর</text>
      </svg>
    </div>

    <div class="checklist-title no-capture">চাঁদপুরের উপজেলা/থানা নির্বাচন করুন:</div>

    <!-- 8 Upazilas Checklist -->
    <div class="spot-list no-capture">
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-sadar" onchange="syncMap('u-sadar')"><label for="chk-u-sadar">১. চাঁদপুর সদর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-hajiganj" onchange="syncMap('u-hajiganj')"><label for="chk-u-hajiganj">২. হাজীগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-shahrasti" onchange="syncMap('u-shahrasti')"><label for="chk-u-shahrasti">৩. শাহরাস্তি</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-matlab-n" onchange="syncMap('u-matlab-n')"><label for="chk-u-matlab-n">৪. মতলব উত্তর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-matlab-s" onchange="syncMap('u-matlab-s')"><label for="chk-u-matlab-s">৫. মতলব দক্ষিণ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-kachua" onchange="syncMap('u-kachua')"><label for="chk-u-kachua">৬. কচুয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-faridganj" onchange="syncMap('u-faridganj')"><label for="chk-u-faridganj">৭. ফরিদগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-haimchar" onchange="syncMap('u-haimchar')"><label for="chk-u-haimchar">৮. হাইমচর</label></div>
    </div>

    <!-- Footer Progress -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% চাঁদপুর ঘোরা হয়েছে</div>
      <div class="watermark">📍 Chandpur Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    const totalUpazilas = 8;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / totalUpazilas) * 100);

      document.getElementById('scoreNum').innerText = `${checked}/${totalUpazilas}`;
      document.getElementById('percentText').innerText = `${percentage}% চাঁদপুর ঘোরা হয়েছে`;
    }

    function toggleUpazila(id) {
      const checkbox = document.getElementById('chk-' + id);
      const shape = document.getElementById(id);

      checkbox.checked = !checkbox.checked;
      if (checkbox.checked) {
        shape.classList.add('active');
      } else {
        shape.classList.remove('active');
      }
      updateResult();
    }

    function syncMap(id) {
      const checkbox = document.getElementById('chk-' + id);
      const shape = document.getElementById(id);

      if (checkbox.checked) {
        shape.classList.add('active');
      } else {
        shape.classList.remove('active');
      }
      updateResult();
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'chandpur-travel-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
