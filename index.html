<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>চাঁদপুর জেলা ভ্রমণ মানচিত্র - Chandpur Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Layout */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Clean White Interactive Map Box Container */
    .map-box {
      width: 100%;
      background: #fdfbf7;
      border-radius: 18px;
      padding: 12px;
      border: 1.5px solid #dcd5c0;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .map-title-header {
      font-size: 14px;
      font-weight: bold;
      color: #006a4e;
      margin-bottom: 8px;
    }

    .map-box svg {
      width: 100%;
      height: auto;
      max-height: 280px;
    }

    /* River Representation */
    .river-main {
      fill: none;
      stroke: #7bb3d6;
      stroke-width: 12;
      stroke-linecap: round;
    }

    /* Default Upazila Shape (White) */
    .upazila-shape {
      fill: #ffffff;
      stroke: #d0c8b6;
      stroke-width: 2;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upazila-shape:hover {
      fill: #f0ebe0;
    }

    /* Active Selected Upazila Shape (Green) */
    .upazila-shape.active {
      fill: #006a4e !important;
      stroke: #004d38 !important;
    }

    /* Text inside Map */
    .map-label {
      font-size: 11px;
      fill: #111111;
      font-weight: 700;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
      transition: fill 0.3s ease;
    }

    /* Text Color turns White when Selected */
    .upazila-group.active .map-label {
      fill: #ffffff !important;
    }

    /* Checklist Section */
    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 6px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 8px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
      transition: background 0.2s;
    }
    .spot-item:hover { background: #f0f7f4; }
    .spot-item input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13.5px; width: 100%; color: #333; font-weight: 600; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 12px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

  <div class="card-container" id="captureCard">
    
    <!-- Top Header Layout -->
    <div class="top-header">
      <div class="profile-box">
        <img id="avatar" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23999'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="প্রোফাইল ছবি">
        <div class="user-titles">
          <p class="subtitle">চাঁদপুর জেলা ভ্রমণ মানচিত্র</p>
          <h3 id="userNameDisplay">ইসমাইল হোসেন</h3>
        </div>
      </div>
      
      <div class="score-badge" id="scoreNum">
        ০/৮
      </div>
    </div>

    <!-- Controls to Edit Name & Image -->
    <div class="input-controls no-capture">
      <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()" value="ইসমাইল হোসেন">
      <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">
    </div>

    <!-- Interactive Chandpur District Vector Map -->
    <div class="map-box">
      <div class="map-title-header">🗺️ চাঁদপুর জেলা ভ্রমণ মানচিত্র</div>
      <svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
        <!-- নদী সীমানা -->
        <path class="river-main" d="M20,40 Q160,80 230,20 T380,80" />
        <path class="river-main" d="M230,20 Q250,110 270,260" />

        <!-- ১. মতলব উত্তর -->
        <g id="grp-u-matlab-n" class="upazila-group" onclick="toggleUpazila('u-matlab-n')">
          <path id="u-matlab-n" class="upazila-shape" d="M80,20 L175,20 L165,65 L70,60 Z" />
          <text class="map-label" x="122" y="42">মতলব উত্তর</text>
        </g>

        <!-- ২. মতলব দক্ষিণ -->
        <g id="grp-u-matlab-s" class="upazila-group" onclick="toggleUpazila('u-matlab-s')">
          <path id="u-matlab-s" class="upazila-shape" d="M70,60 L165,65 L155,115 L60,105 Z" />
          <text class="map-label" x="112" y="88">মতলব দক্ষিণ</text>
        </g>

        <!-- ৩. কচুয়া -->
        <g id="grp-u-kachua" class="upazila-group" onclick="toggleUpazila('u-kachua')">
          <path id="u-kachua" class="upazila-shape" d="M175,20 L275,25 L260,90 L165,65 Z" />
          <text class="map-label" x="218" y="55">কচুয়া</text>
        </g>

        <!-- ৪. হাজীগঞ্জ -->
        <g id="grp-u-hajiganj" class="upazila-group" onclick="toggleUpazila('u-hajiganj')">
          <path id="u-hajiganj" class="upazila-shape" d="M165,65 L260,90 L245,150 L155,115 Z" />
          <text class="map-label" x="206" y="108">হাজীগঞ্জ</text>
        </g>

        <!-- ৫. শাহরাস্তি -->
        <g id="grp-u-shahrasti" class="upazila-group" onclick="toggleUpazila('u-shahrasti')">
          <path id="u-shahrasti" class="upazila-shape" d="M245,150 L340,130 L320,200 L235,195 Z" />
          <text class="map-label" x="285" y="165">শাহরাস্তি</text>
        </g>

        <!-- ৬. চাঁদপুর সদর -->
        <g id="grp-u-sadar" class="upazila-group" onclick="toggleUpazila('u-sadar')">
          <path id="u-sadar" class="upazila-shape" d="M60,105 L155,115 L140,185 L50,170 Z" />
          <text class="map-label" x="102" y="145">চাঁদপুর সদর</text>
        </g>

        <!-- ৭. ফরিদগঞ্জ -->
        <g id="grp-u-faridganj" class="upazila-group" onclick="toggleUpazila('u-faridganj')">
          <path id="u-faridganj" class="upazila-shape" d="M140,185 L235,195 L220,255 L130,245 Z" />
          <text class="map-label" x="181" y="220">ফরিদগঞ্জ</text>
        </g>

        <!-- ৮. হাইমচর -->
        <g id="grp-u-haimchar" class="upazila-group" onclick="toggleUpazila('u-haimchar')">
          <path id="u-haimchar" class="upazila-shape" d="M50,170 L140,185 L130,245 L40,225 Z" />
          <text class="map-label" x="90" y="208">হাইমচর</text>
        </g>
      </svg>
    </div>

    <div class="checklist-title no-capture">চাঁদপুরের উপজেলা/থানা নির্বাচন করুন:</div>

    <!-- 8 Upazilas Checklist -->
    <div class="spot-list no-capture">
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-sadar" onchange="syncMap('u-sadar')"><label for="chk-u-sadar">১. চাঁদপুর সদর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-hajiganj" onchange="syncMap('u-hajiganj')"><label for="chk-u-hajiganj">২. হাজীগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-shahrasti" onchange="syncMap('u-shahrasti')"><label for="chk-u-shahrasti">৩. শাহরাস্তি</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-matlab-n" onchange="syncMap('u-matlab-n')"><label for="chk-u-matlab-n">৪. মতলব উত্তর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-matlab-s" onchange="syncMap('u-matlab-s')"><label for="chk-u-matlab-s">৫. মতলব দক্ষিণ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-kachua" onchange="syncMap('u-kachua')"><label for="chk-u-kachua">৬. কচুয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-faridganj" onchange="syncMap('u-faridganj')"><label for="chk-u-faridganj">৭. ফরিদগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-u-haimchar" onchange="syncMap('u-haimchar')"><label for="chk-u-haimchar">৮. হাইমচর</label></div>
    </div>

    <!-- Footer Progress -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% চাঁদপুর ঘোরা হয়েছে</div>
      <div class="watermark">📍 Chandpur Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    const totalUpazilas = 8;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / totalUpazilas) * 100);

      document.getElementById('scoreNum').innerText = `${checked}/${totalUpazilas}`;
      document.getElementById('percentText').innerText = `${percentage}% চাঁদপুর ঘোরা হয়েছে`;
    }

    function toggleUpazila(id) {
      const checkbox = document.getElementById('chk-' + id);
      const shape = document.getElementById(id);
      const group = document.getElementById('grp-' + id);

      checkbox.checked = !checkbox.checked;
      if (checkbox.checked) {
        shape.classList.add('active');
        group.classList.add('active');
      } else {
        shape.classList.remove('active');
        group.classList.remove('active');
      }
      updateResult();
    }

    function syncMap(id) {
      const checkbox = document.getElementById('chk-' + id);
      const shape = document.getElementById(id);
      const group = document.getElementById('grp-' + id);

      if (checkbox.checked) {
        shape.classList.add('active');
        group.classList.add('active');
      } else {
        shape.classList.remove('active');
        group.classList.remove('active');
      }
      updateResult();
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'chandpur-travel-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
