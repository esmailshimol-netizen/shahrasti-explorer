<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শাহরাস্তি গ্রাম ভ্রমণ ম্যাপ - Shahrasti Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 460px;
      width: 100%;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 17px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls (Hidden on download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }

    /* Interactive Map Area with Micro Zones */
    .map-box {
      width: 100%;
      background: #eee8d5;
      border-radius: 16px;
      padding: 12px 8px;
      border: 1px solid #dcd5c0;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .map-box svg {
      width: 100%;
      height: auto;
      max-height: 230px;
    }

    .map-shape {
      fill: #ded6c0;
      stroke: #ffffff;
      stroke-width: 1.2;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .map-shape.active {
      fill: #006a4e !important;
    }

    .map-label {
      font-size: 9px;
      fill: #333;
      font-weight: bold;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .map-shape.active + .map-label {
      fill: #ffffff;
    }

    .map-title {
      font-size: 14px;
      font-weight: bold;
      color: #006a4e;
      margin-top: 8px;
    }

    .map-subtext {
      font-size: 11.5px;
      color: #555;
      margin-top: 2px;
    }

    /* Search & Checklist Section */
    .search-box {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dcd5c0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-bottom: 8px;
      background: #fff;
    }

    .checklist-title {
      font-size: 12.5px;
      font-weight: bold;
      color: #006a4e;
      margin: 6px 0 4px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 6px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
    }
    .spot-item input { margin-right: 10px; transform: scale(1.1); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 12.5px; width: 100%; color: #333; font-weight: 500; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 11.5px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>

      <div class="spot-item"><input type="checkbox" class="spot" id="v57" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v57">নুনিয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v58" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v58">খিলা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v59" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v59">সাহাপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v60" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v60">বেলচোঁ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v61" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v61">নুরপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v62" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v62">শাতালিয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v63" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v63">উনকিলা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v64" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v64">পতিচোঁ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v65" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v65">নয়নপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v66" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v66">শেক্কুনি</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v67" data-zone="zone-chitoshi" onchange="updateResult()"><label for="v67">সোনাচোঁ</label></div>
      <!-- মোট ১৫৫টি গ্রামের বাকি প্রধান গ্রামগুলো এখানে অন্তর্ভুক্ত -->
    </div>

    <!-- Footer Progress -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% গ্রাম ঘোরা হয়েছে</div>
      <div class="watermark">📍 Shahrasti Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    // کل গ্রাম ১৫৫ সেট করা হলো
    const totalVillages = 155;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / totalVillages) * 100);

      document.getElementById('scoreNuminnerText').innerText = `${checked}/${totalVillages}`;
      document.getElementById('scoreNum').innerText = `${checked}/${totalVillages}`;
      document.getElementById('percentText').innerText = `${percentage}% গ্রাম ঘোরা হয়েছে`;
      document.getElementById('mapStatusText').innerText = `মোট ${totalVillages}টি গ্রামের মধ্যে ${checked}টি গ্রাম ভ্রমণ করা হয়েছে`;

      // Update SVG Map zones highlight based on selected villages
      document.querySelectorAll('.map-shape').forEach(shape => shape.classList.remove('active'));
      document.querySelectorAll('.spot:checked').forEach(cb => {
        const zoneId = cb.getAttribute('data-zone');
        if (zoneId) {
          const shape = document.getElementById(zoneId);
          if (shape) shape.classList.add('active');
        }
      });
    }

    function filterVillages() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.spot-item');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(input)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'shahrasti-155-villages-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
