<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শাহরাস্তি এক্সপ্লোরার - ইন্টারঅ্যাক্টিভ ম্যাপ</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #eef2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
    
    .card-container {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border: 2px solid #006a4e;
      position: relative;
    }
    
    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: #006a4e; margin: 5px 0; font-size: 26px; }
    .header p { color: #555; font-size: 14px; margin: 0; }
    
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      display: none;
    }

    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    /* SVG Map Styling */
    .map-container {
      width: 100%;
      background: #f0f7f4;
      border-radius: 15px;
      padding: 15px;
      border: 1px solid #c8e6c9;
      margin-bottom: 15px;
      text-align: center;
    }

    .map-container svg {
      width: 100%;
      height: auto;
      max-height: 280px;
    }

    .union-shape {
      fill: #d1e7dd;
      stroke: #006a4e;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .union-shape:hover {
      fill: #a3cfbb;
    }

    .union-shape.active {
      fill: #006a4e !important;
    }

    .map-text {
      font-size: 11px;
      fill: #155724;
      font-weight: bold;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .map-text.active-text {
      fill: #ffffff;
    }

    /* List Styling */
    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #f8faf9;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e0e0e0;
      transition: all 0.2s ease;
    }

    .spot-item:hover { background: #e8f5e9; border-color: #a5d6a7; }
    .spot-item input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 14.5px; width: 100%; color: #333; }

    .result-box {
      background: linear-gradient(135deg, #006a4e, #004d38);
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      margin-top: 18px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.2);
    }
    
    .result-box h3 { margin: 0; font-size: 22px; }
    .result-box p { margin: 6px 0 0 0; font-size: 15px; opacity: 0.95; }

    .btn-download {
      width: 100%;
      background: #f42a41;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      transition: background 0.3s;
    }

    .btn-download:hover { background: #d02235; }
    
    .no-capture { display: block; }
  </style>
</head>
<body>

    <div class="header">
      <h2>শাহরাস্তি এক্সপ্লোরার 🗺️</h2>
      <p>শাহরাস্তি উপজেলার কতটি ইউনিয়ন আপনি ঘুরেছেন?</p>
    </div>

    <div class="profile-section">
      <img id="avatar" class="avatar-preview" src="" alt="প্রোফাইল ছবি">
      <div class="input-group no-capture" id="inputGroup">
        <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()">
        <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">

    </div>
