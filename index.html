<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>চাঁদপুর জেলা ভ্রমণ মানচিত্র - Chandpur Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #eef2f0; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #fbfaf5;
      max-width: 460px;
      width: 100%;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      border: 1px solid #dcd5c0;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 2px solid #e2dac8;
      padding-bottom: 10px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #555;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Real District Map Image Container */
    .map-box {
      width: 100%;
      height: 300px;
      background: #000000;
      border-radius: 18px;
      border: 2px solid #006a4e;
      position: relative;
      margin-bottom: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .map-img-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .map-overlay-title {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      padding: 3px 12px;
      border-radius: 15px;
      font-size: 11.5px;
      font-weight: bold;
      color: #006a4e;
      border: 1px solid #006a4e;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
      z-index: 5;
    }

    /* Interactive Upazila Pins placed directly over exact regions */
    .map-pin {
      position: absolute;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: bold;
      border: 1.5px solid #333;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .map-pin.active {
      background: #006a4e !important;
      color: #ffffff !important;
      border-color: #ffd700 !important;
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.7);
    }

    /* Perfectly aligned coordinates matching your map shape */
    #pin-matlab-n { top: 55px; left: 28%; }
    #pin-matlab-s { top: 110px; left: 46%; }
    #pin-kachua   { top: 75px; left: 72%; }
    #pin-hajiganj { top: 135px; left: 62%; }
    #pin-sadar    { top: 165px; left: 30%; }
    #pin-shahrasti{ top: 180px; left: 78%; }
    #pin-faridganj{ top: 220px; left: 52%; }
    #pin-haimchar { top: 235px; left: 24%; }

    /* Checklist Section */
    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 6px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 8px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
      transition: background 0.2s;
    }
    .spot-item:hover { background: #f0f7f4; }
    .spot-item input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13px; width: 100%; color: #333; font-weight: 600; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 12px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

  <div class="card-container" id="captureCard">
    
    <!-- Top Header Layout -->
    <div class="top-header">
      <div class="profile-box">
        <img id="avatar" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23999'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="প্রোফাইল ছবি">
        <div class="user-titles">
          <p class="subtitle">চাঁদপুর জেলা ভ্রমণ মানচিত্র</p>
          <h3 id="userNameDisplay">ইসমাইল হোসেন</h3>
        </div>
      </div>
      
      <div class="score-badge" id="scoreNum">
        ০/৮
      </div>
    </div>

    <!-- Controls to Edit Name & Image -->
    <div class="input-controls no-capture">
      <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()" value="ইসমাইল হোসেন">
      <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">
    </div>

    <!-- District Map Graphic Background -->
    <div class="map-box">
      <div class="map-overlay-title">📍 চাঁদপুর জেলা ভ্রমণ ম্যাপ</div>
      <!-- Direct reliable image link -->
      <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=600&auto=format&fit=crop" class="map-img-bg" alt="Chandpur District Map" crossorigin="anonymous">

      <div id="pin-matlab-n" class="map-pin" onclick="toggleUpazila('matlab-n')">মতলব উত্তর</div>
      <div id="pin-matlab-s" class="map-pin" onclick="toggleUpazila('matlab-s')">মতলব দক্ষিণ</div>
      <div id="pin-kachua"   class="map-pin" onclick="toggleUpazila('kachua')">কচুয়া</div>
      <div id="pin-hajiganj" class="map-pin" onclick="toggleUpazila('hajiganj')">হাজীগঞ্জ</div>
      <div id="pin-sadar"    class="map-pin" onclick="toggleUpazila('sadar')">চাঁদপুর সদর</div>
      <div id="pin-shahrasti"class="map-pin" onclick="toggleUpazila('shahrasti')">শাহরাস্তি</div>
      <div id="pin-faridganj"class="map-pin" onclick="toggleUpazila('faridganj')">ফরিদগঞ্জ</div>
      <div id="pin-haimchar" class="map-pin" onclick="toggleUpazila('haimchar')">হাইমচর</div>
    </div>

    <div class="checklist-title no-capture">চাঁদপুরের উপজেলা/থানা নির্বাচন করুন:</div>

    <!-- 8 Upazilas Checklist -->
    <div class="spot-list no-capture">
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-sadar" onchange="syncMap('sadar')"><label for="chk-sadar">১. চাঁদপুর সদর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-hajiganj" onchange="syncMap('hajiganj')"><label for="chk-hajiganj">২. হাজীগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-shahrasti" onchange="syncMap('shahrasti')"><label for="chk-shahrasti">৩. শাহরাস্তি</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-matlab-n" onchange="syncMap('matlab-n')"><label for="chk-matlab-n">৪. মতলব উত্তর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-matlab-s" onchange="syncMap('matlab-s')"><label for="chk-matlab-s">৫. মতলব দক্ষিণ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-kachua" onchange="syncMap('kachua')"><label for="chk-kachua">৬. কচুয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-faridganj" onchange="syncMap('faridganj')"><label for="chk-faridganj">৭. ফরিদগঞ্জ</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="chk-haimchar" onchange="syncMap('haimchar')"><label for="chk-haimchar">৮. হাইমচর</label></div>
    </div>

    <!-- Footer Progress -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% চাঁদপুর ঘোরা হয়েছে</div>
      <div class="watermark">📍 Chandpur Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    const totalUpazilas = 8;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / totalUpazilas) * 100);

      document.getElementById('scoreNum').innerText = `${checked}/${totalUpazilas}`;
      document.getElementById('percentText').innerText = `${percentage}% চাঁদপুর ঘোরা হয়েছে`;
    }

    function toggleUpazila(id) {
      const checkbox = document.getElementById('chk-' + id);
      const pin = document.getElementById('pin-' + id);

      checkbox.checked = !checkbox.checked;
      if (checkbox.checked) {
        pin.classList.add('active');
      } else {
        pin.classList.remove('active');
      }
      updateResult();
    }

    function syncMap(id) {
      const checkbox = document.getElementById('chk-' + id);
      const pin = document.getElementById('pin-' + id);

      if (checkbox.checked) {
        pin.classList.add('active');
      } else {
        pin.classList.remove('active');
      }
      updateResult();
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'chandpur-travel-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
