<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শাহরাস্তি স্যাটেলাইট বাউন্ডারি ম্যাপ - Shahrasti Explorer</title>
  <!-- HTML2Canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
    
    .card-container {
      background: #faf8f3;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      border: 1px solid #e2dbcc;
      position: relative;
    }
    
    /* Top Header Section */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid #eae3d0;
      padding-bottom: 12px;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #006a4e;
      background: #e0dccc;
    }

    .user-titles .subtitle {
      font-size: 11.5px;
      color: #666;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .user-titles h3 {
      font-size: 18px;
      color: #111;
      margin: 2px 0 0 0;
    }

    /* Score Badge */
    .score-badge {
      background: #006a4e;
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.25);
    }

    /* Input Controls (Hidden on download) */
    .input-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #eee8d5;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dcd5c0;
    }
    .input-controls input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* Real Satellite Boundary Map Simulation Box */
    .map-box {
      width: 100%;
      background: #1a2e26;
      border-radius: 18px;
      padding: 15px;
      border: 2px solid #006a4e;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .boundary-svg-container {
      width: 100%;
      height: 200px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shahrasti-boundary {
      fill: #2d4a3e;
      stroke: #f42a41;
      stroke-width: 3;
      stroke-dasharray: 6,4;
      transition: all 0.3s ease;
    }

    .shahrasti-boundary.highlighted {
      fill: #006a4e;
      stroke: #ffffff;
    }

    .map-inner-text {
      position: absolute;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    .map-subtext {
      font-size: 12.5px;
      color: #b2d8cc;
      margin-top: 8px;
    }

    /* Search & Checklist Section */
    .search-box {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #dcd5c0;
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      margin-bottom: 8px;
      background: #fff;
    }

    .checklist-title {
      font-size: 13px;
      font-weight: bold;
      color: #006a4e;
      margin: 8px 0 4px 0;
    }

    .spot-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 170px;
      overflow-y: auto;
      padding-right: 4px;
      border-top: 1px solid #eae3d0;
      padding-top: 6px;
    }

    .spot-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #e2dbcc;
    }
    .spot-item input { margin-right: 10px; transform: scale(1.1); cursor: pointer; }
    .spot-item label { cursor: pointer; font-size: 13px; width: 100%; color: #333; font-weight: 500; }

    /* Footer Progress */
    .footer-progress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eae3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #333;
    }
    .watermark {
      font-size: 12px;
      color: #006a4e;
      font-weight: 700;
    }

    .btn-download {
      width: 100%;
      background: #006a4e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
      box-shadow: 0 4px 12px rgba(0, 106, 78, 0.3);
    }
    .btn-download:hover { background: #004d38; }
    .no-capture { display: block; }
  </style>
</head>
<body>

  <div class="card-container" id="captureCard">
    
    <!-- Top Header Layout -->
    <div class="top-header">
      <div class="profile-box">
        <img id="avatar" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23999'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="প্রোফাইল ছবি">
        <div class="user-titles">
          <p class="subtitle">শাহরাস্তি স্যাটেলাইট ম্যাপ</p>
          <h3 id="userNameDisplay">ইসমাইল হোসেন</h3>
        </div>
      </div>
      
      <div class="score-badge" id="scoreNum">
        ০/১৫৫
      </div>
    </div>

    <!-- Controls to Edit Name & Image -->
    <div class="input-controls no-capture">
      <input type="text" id="userName" placeholder="আপনার নাম লিখুন..." oninput="updateResult()" value="ইসমাইল হোসেন">
      <input type="file" id="imageInput" accept="image/*" onchange="loadProfileImage(event)">
    </div>

    <!-- Google Maps Style Satellite Boundary View -->
    <div class="map-box">
      <div class="boundary-svg-container">
        <svg width="100%" height="100%" viewBox="0 0 320 180">
          <!-- শাহরাস্তির সঠিক গুগল ম্যাপ বাউন্ডারি শেপ -->
          <polygon id="shahrastiBoundaryShape" class="shahrasti-boundary" points="60,20 280,45 260,160 40,130" />
        </svg>
        <div class="map-inner-text">📍 Shahrasti / শাহরাস্তি</div>
      </div>
      <div class="map-subtext" id="mapStatusText">মোট ১৫৫টি গ্রামের মধ্যে ০টি গ্রাম ভ্রমণ করা হয়েছে</div>
    </div>

    <!-- Search Box for Villages -->
    <div class="no-capture">
      <input type="text" id="searchInput" class="search-box" placeholder="🔎 ১৫৫টি গ্রাম থেকে আপনার গ্রাম খুঁজুন..." onkeyup="filterVillages()">
    </div>

    <div class="checklist-title no-capture">গ্রাম নির্বাচন করুন:</div>

    <!-- Village Checklists -->
    <div class="spot-list no-capture" id="villageList">
      <div class="spot-item"><input type="checkbox" class="spot" id="v1" onchange="updateResult()"><label for="v1">মেহের</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v2" onchange="updateResult()"><label for="v2">উয়ারুক</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v3" onchange="updateResult()"><label for="v3">ফতেপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v4" onchange="updateResult()"><label for="v4">ভোলদিঘী</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v5" onchange="updateResult()"><label for="v5">মালরা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v6" onchange="updateResult()"><label for="v6">পদুয়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v7" onchange="updateResult()"><label for="v7">দারুনকরা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v8" onchange="updateResult()"><label for="v8">দেবকরা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v9" onchange="updateResult()"><label for="v9">দেবীপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v10" onchange="updateResult()"><label for="v10">নয়নগর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v11" onchange="updateResult()"><label for="v11">তারাপুর</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v12" onchange="updateResult()"><label for="v12">কাঁকৈরতলা</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v13" onchange="updateResult()"><label for="v13">চিতোষী</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v14" onchange="updateResult()"><label for="v14">সূচীপাড়া</label></div>
      <div class="spot-item"><input type="checkbox" class="spot" id="v15" onchange="updateResult()"><label for="v15">ইছাপুরা</label></div>
      <!-- ১৫৫টি গ্রামের বাকি তালিকা -->
    </div>

    <!-- Footer Progress -->
    <div class="footer-progress">
      <div class="progress-text" id="percentText">০% গ্রাম ঘোরা হয়েছে</div>
      <div class="watermark">📍 Shahrasti Explorer</div>
    </div>

    <button class="btn-download no-capture" onclick="downloadImage()">কার্ড ডাউনলোড করুন 📸</button>
  </div>

  <script>
    const totalVillages = 155;

    function updateResult() {
      const nameInput = document.getElementById('userName').value.trim();
      document.getElementById('userNameDisplay').innerText = nameInput ? nameInput : 'ভ্রমণকারী';
      
      const checked = document.querySelectorAll('.spot:checked').length;
      const percentage = Math.round((checked / totalVillages) * 100);

      document.getElementById('scoreNum').innerText = `${checked}/${totalVillages}`;
      document.getElementById('percentText').innerText = `${percentage}% গ্রাম ঘোরা হয়েছে`;
      document.getElementById('mapStatusText').innerText = `মোট ${totalVillages}টি গ্রামের মধ্যে ${checked}টি গ্রাম ভ্রমণ করা হয়েছে`;

      // Highlight boundary shape if any village is selected
      const boundaryShape = document.getElementById('shahrastiBoundaryShape');
      if (checked > 0) {
        boundaryShape.classList.add('highlighted');
      } else {
        boundaryShape.classList.remove('highlighted');
      }
    }

    function filterVillages() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.spot-item');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(input)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function loadProfileImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('avatar');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function downloadImage() {
      const card = document.getElementById('captureCard');
      const noCaptureElements = document.querySelectorAll('.no-capture');

      noCaptureElements.forEach(el => el.style.display = 'none');

      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'shahrasti-satellite-map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        noCaptureElements.forEach(el => el.style.display = 'block');
      });
    }
  </script>

</body>
</html>
